<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CapyMundo | A Vida Zen das Capivaras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav aria-label="Menu principal">
            <div class="logo">🐾 CapyMundo</div>
            <div class="controls" role="group" aria-label="Ferramentas de acessibilidade">
                <button id="btn-contrast" title="Alternar Alto Contraste">🌓</button>
                <button id="btn-font-up" title="Aumentar fonte">A+</button>
                <button id="btn-font-down" title="Diminuir fonte">A-</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero scroll-reveal" aria-labelledby="hero-title">
            <h1 id="hero-title">O Maior Roedor, O Maior Coração.</h1>
            <p>Descubra por que as capivaras são as rainhas da coexistência pacífica.</p>
        </section>

        <section id="features" class="scroll-reveal" aria-labelledby="features-title">
            <h2 id="features-title">Curiosidades de Capivara</h2>
            <div id="features-grid" class="grid-container">
                </div>
        </section>

        <section class="faq-section scroll-reveal" aria-labelledby="faq-title">
            <h2 id="faq-title">Dúvidas Comuns</h2>
            <div id="faq-container">
                </div>
        </section>
    </main>

    <footer class="scroll-reveal">
        <p>&copy; 2024 CapyMundo - Feito com foco em UX e respeito à fauna.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
