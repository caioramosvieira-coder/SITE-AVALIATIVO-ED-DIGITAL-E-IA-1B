<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTech | Soluções Sustentáveis</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav aria-label="Navegação Principal">
            <div class="logo">EcoTech</div>
            <div class="accessibility-controls">
                <button id="btn-contrast" aria-label="Alternar Alto Contraste">🌓 Contraste</button>
                <button id="btn-font-up" aria-label="Aumentar Fonte">A+</button>
                <button id="btn-font-down" aria-label="Diminuir Fonte">A-</button>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero scroll-reveal">
            <h1>Inovação que respeita o planeta</h1>
            <p>Tecnologia Full-Stack a serviço do meio ambiente.</p>
        </section>

        <section id="services" class="scroll-reveal" aria-labelledby="services-title">
            <h2 id="services-title">Nossos Serviços</h2>
            <div id="services-container" class="grid-layout">
                </div>
        </section>

        <section class="faq scroll-reveal">
            <h2>Dúvidas Frequentes</h2>
            <div id="faq-container">
                </div>
        </section>
    </main>

    <footer class="scroll-reveal">
        <p>&copy; 2024 EcoTech. Desenvolvido com foco em Acessibilidade.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
